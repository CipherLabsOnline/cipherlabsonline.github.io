<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Polybius</title>
    <link rel="stylesheet" type="text/css" href="../css/styles.css">
</head>

<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="../workstation.html">Work Station</a>
        <a href=""><img
                src="https://raw.githubusercontent.com/dug22/Cipher-Labs/master/cipher-labs-ui/src/main/resources/images/cipher-labs-desktop-icon.png"></a>
        <a href="../cryptanalysis/lockspot.html">Lock Spot</a>
        <a href="../resources.html">Resources</a>
    </nav>
    <br>
    <div class="cipher-header">
        <h2><img src="../imgs/polybius.png" width="32px" height="32px">Polybius Cipher
            <button title="Read More" type="submit"
                onclick="PopupUtils.openPopupArticle('../resources/articles/polybius-cipher-article.html', 'Information Behind The Polybius Cipher')"
                ;>
                📜
            </button>
        </h2>
        <p>A classic grid-based subsitution cipher that convert letters into pairs of numerical coordinates</p>
    </div>

    <div class="cipher-container">
        <div class="plaintext-container">
            <label for="plaintext">Plaintext</label>
            <textarea id="plaintextTextArea" class="plaintext-textarea"
                placeholder="Type your plain text here">SECRET</textarea>
        </div>
        <div class="ciphertext-container">
            <label for="ciphertext">Ciphertext</label>
            <textarea id="ciphertextTextArea" class="ciphertext-textarea"
                placeholder="Type your ciphertext here"></textarea>
        </div>
    </div>
    <aside class="cipher-options">
        <div class="options-content">
            <label><strong>Cipher Options</strong></label>
            <div class="options-row-textbox-group">
                <label>Alphabet (Letters And Digits Only)</label>
                <input style="text-align: center;" type="text" id="alphabet-textbox" value="ABCDEFGHIKLMNOPQRSTUVWXYZ">
            </div>
            <div class="polybius-square-options">
                <label>Matrix Size</label>
                <select id="grid-size">
                    <option value="5x5">5x5 Requires 25 Characters</option>
                    <option value="6x6">6x6 Requires 36 Characters</option>
                </select>
              
                <label>Coordinate Order</label>
                <select id="coordinate-order">
                    <option value="Row, Column">Row, Column</option>
                    <option value="Column, Row">Column, Row</option>
                </select>
                <br>
                <label>Polybius Square Visual</label>
                <div id="polybius-grid"></div>
            </div>
        </div>
        
    </aside>
    <dialog id="algorithm-info">
        <div class="dialog-header">
            <h2></h2>
            <button onClick="PopupUtils.closePopupArticle()" class="close-x">&times;</button>
        </div>
        <iframe id="algorithmIframe" class="algorithm-iframe"></iframe>
    </dialog>
    <script src="../js/popup-utils.js" type="module"></script>
    <script src="../js/workstation/ciphers/polybius-cipher.js" type="module"></script>
    <br>
    <footer>
        <p>© 2026 CipherLabs. All rights reserved.</p>
    </footer>
</body>

</html>
