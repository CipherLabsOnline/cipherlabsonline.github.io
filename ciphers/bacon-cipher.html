<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Baconian Cipher</title>
    <link rel="stylesheet" type="text/css" href="../css/styles.css">
</head>

<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="../workstation.html">Work Station</a>
        <a href=""><img
                src="https://raw.githubusercontent.com/dug22/Cipher-Labs/master/cipher-labs-ui/src/main/resources/images/cipher-labs-desktop-icon.png"></a>
        <a href="../lockspot.html">Lock Spot</a>
        <a href="../resources.html">Resources</a>
    </nav>
    <br>
    <div class="cipher-header">
        <h2><img src="../imgs/francis-bacon.png" width="32px" height="32px">Bacon Cipher
            <button title="Read More" type="submit"
                onclick="PopupUtils.openPopupArticle('../resources/articles/baconian-cipher-article.html', 'Information Behind The Baconian Cipher')"
                ;>
                📜
            </button>
        </h2>
        <p>A 5-bit steganographic cipher by Sir Francis Bacon that hides letters using distinct text styles, binary, or
            'A/B' variables.</p>
    </div>
    <div class="bacon-cipher-container">
        <div class="plaintext-container">
            <label for="plaintext">Plaintext Message</label>
            <textarea id="plaintextTextArea" class="plaintext-textarea"
                placeholder="Type your plain text here">SECRET</textarea>
        </div>
        <div class="encoded-text-container">
            <label for="encoded">Encoded Message</label>
            <textarea id="encodedTextArea" class="encoded-textarea"
                placeholder="Type your encoded text here"></textarea>
        </div>
    </div>
    <aside class="bacon-cipher-options">

        <div class="options-content">
            <label><strong>Options</strong></label>
            <label>Encoding Era</label>
            <select id="era" id="era-select">
                <option value="early">Early</option>
                <option value="modern">Modern</option>
            </select>

            <label>Encoding Type</label>
            <select id="encodingType">
                <option value="binary">Binary</option>
                <option value="code">Code A/B</option>
            </select>
            <label>Encoding Table</label>
            <table id="encoding-table">
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </aside>
    <dialog id="algorithm-info">
        <div class="dialog-header">
            <h2></h2>
            <button onClick="PopupUtils.closePopupArticle()" class="close-x">&times;</button>
        </div>
        <iframe id="algorithmIframe" class="algorithm-iframe"></iframe>
    </dialog>
    <script src="../js/popup-utils.js" type="module"></script>
    <script src="../js/workstation/ciphers/baconian-cipher.js" type="module"></script>
    <br>
    <footer>
        <p>© 2026 CipherLabs. All rights reserved.</p>
    </footer>
</body>
</html>
